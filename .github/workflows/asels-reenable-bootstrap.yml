name: ASELS Workflow Scheduler Hard Reset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/asels-reenable-bootstrap.yml"

permissions:
  actions: write
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Show ASELS workflow states before reset
        shell: bash
        run: |
          set -euo pipefail
          echo "=== BEFORE ==="
          gh api "repos/${REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.path | contains("asels")) | [.name,.path,.state,.id] | @tsv'

      - name: Disable ASELS delivery workflows
        shell: bash
        run: |
          set -euo pipefail
          for workflow in \
            asels-30min-v2.yml \
            asels-preopen-teorik.yml \
            asels-eod-takas.yml \
            asels-watchdog.yml
          do
            echo "Disabling ${workflow}"
            gh api -X PUT "repos/${REPOSITORY}/actions/workflows/${workflow}/disable"
          done

      - name: Re-enable ASELS delivery workflows
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          for workflow in \
            asels-30min-v2.yml \
            asels-preopen-teorik.yml \
            asels-eod-takas.yml \
            asels-watchdog.yml
          do
            echo "Enabling ${workflow}"
            gh api -X PUT "repos/${REPOSITORY}/actions/workflows/${workflow}/enable"
          done

      - name: Verify active states after reset
        shell: bash
        run: |
          set -euo pipefail
          echo "=== AFTER ==="
          gh api "repos/${REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.path | contains("asels")) | [.name,.path,.state,.id] | @tsv'

      - name: Dispatch watchdog registration probe
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST "repos/${REPOSITORY}/actions/workflows/asels-watchdog.yml/dispatches" \
            -f ref=main
          echo "Watchdog workflow_dispatch requested after hard reset."
