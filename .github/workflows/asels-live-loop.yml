name: ASELS Live Loop
run-name: "ASELS Live Loop · ${{ github.event_name }}"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/asels-live-loop.yml"
      - "scripts/asels_scheduler.py"
      - "src/main.py"
      - "src/config.py"
      - "requirements.txt"

permissions:
  actions: read
  contents: read

concurrency:
  group: asels-live-loop
  cancel-in-progress: true

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run resilient ASELS scheduler
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          ASELS_LOOP_RUNTIME_MINUTES: "240"
        run: python scripts/asels_scheduler.py
