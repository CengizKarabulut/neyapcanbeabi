name: ASELS Live Loop
run-name: "ASELS Live Loop · ${{ github.event_name }}"

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: asels-live-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt

      - name: Run ASELS clock loop
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        shell: bash
        run: |
          set -u -o pipefail

          started_epoch="$(date +%s)"
          handoff_after=$((300 * 60))
          handed_off=0

          dispatch_successor() {
            if [ "${handed_off}" -eq 0 ]; then
              echo "[$(TZ=Europe/Istanbul date '+%F %T')] Yeni ASELS Live Loop dispatch ediliyor."
              if gh workflow run asels-live-loop.yml --repo "${GITHUB_REPOSITORY}" --ref main; then
                handed_off=1
              else
                echo "UYARI: successor dispatch başarısız; recovery workflow devralacak."
              fi
            fi
          }

          send_teorik() {
            echo "[$(TZ=Europe/Istanbul date '+%F %T')] /teorik ASELS"
            TELEGRAM_CHAT_ID="@aselsanhissee" \
            SYMBOL="ASELS" \
            COMMANDS="teorik" \
            COMMAND_DELAY_SECONDS="10" \
            DEDUPE_WINDOW_MINUTES="2" \
            python -m src.main || true
          }

          send_intraday() {
            echo "[$(TZ=Europe/Istanbul date '+%F %T')] ASELS intraday"
            TELEGRAM_CHAT_ID="@aselsanhissee" \
            SYMBOL="ASELS" \
            COMMANDS="akd,derinlik,kurum" \
            COMMAND_DELAY_SECONDS="10" \
            DEDUPE_WINDOW_MINUTES="12" \
            python -m src.main || true
          }

          send_takas() {
            echo "[$(TZ=Europe/Istanbul date '+%F %T')] /takas ASELS"
            TELEGRAM_CHAT_ID="@aselsanhissee" \
            SYMBOL="ASELS" \
            COMMANDS="takas" \
            COMMAND_DELAY_SECONDS="10" \
            DEDUPE_WINDOW_MINUTES="60" \
            python -m src.main || true
          }

          echo "ASELS Live Loop başladı: $(TZ=Europe/Istanbul date '+%F %T %Z')"

          while true; do
            dow="$(TZ=Europe/Istanbul date +%u)"
            hour="$(TZ=Europe/Istanbul date +%H)"
            minute="$(TZ=Europe/Istanbul date +%M)"
            second="$(TZ=Europe/Istanbul date +%S)"
            now_hm="${hour}${minute}"

            if [ "${dow}" -le 5 ]; then
              # Açılış öncesi: 09:40, 09:45, 09:50, 09:55, 09:58
              case "${now_hm}" in
                0940|0945|0950|0955|0958)
                  send_teorik
                  ;;
              esac

              # Gün içi: 10:05-17:50 arası :05/:20/:35/:50 ve 18:05/18:15
              if { [ "${hour}" -ge 10 ] && [ "${hour}" -le 17 ] && [[ "${minute}" =~ ^(05|20|35|50)$ ]]; } \
                 || { [ "${hour}" = "18" ] && [[ "${minute}" =~ ^(05|15)$ ]]; }; then
                send_intraday
              fi

              # Gün sonu: yalnız 19:30
              if [ "${hour}" = "19" ] && [ "${minute}" = "30" ]; then
                send_takas
              fi
            fi

            elapsed=$(( $(date +%s) - started_epoch ))
            if [ "${elapsed}" -ge "${handoff_after}" ]; then
              dispatch_successor
              exit 0
            fi

            # Bir sonraki dakika sınırına hizalan.
            second="$(TZ=Europe/Istanbul date +%S)"
            sleep_for=$((60 - 10#${second}))
            if [ "${sleep_for}" -lt 2 ]; then
              sleep_for=2
            fi
            sleep "${sleep_for}"
          done
