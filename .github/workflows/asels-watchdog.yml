name: ASELS Watchdog

on:
  schedule:
    # Açılış öncesi teorik komutların yedek kontrolü (Türkiye saati -> UTC)
    - cron: "43,48,53,57 6 * * 1-5"
    - cron: "2 7 * * 1-5"
    # Gün içi ana turların yaklaşık 7 dakika sonrasında yedek kontrol
    - cron: "12,27,42,57 7-14 * * 1-5"
    - cron: "12,22 15 * * 1-5"
    # 19:30 takas için yedek kontrol
    - cron: "37 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-target-asels-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide watchdog action
        id: decide
        shell: bash
        run: |
          now="$(TZ=Europe/Istanbul date +%H%M)"
          dow="$(TZ=Europe/Istanbul date +%u)"

          echo "run=false" >> "$GITHUB_OUTPUT"

          if [ "${dow}" -gt 5 ]; then
            echo "Hafta sonu: watchdog işlem yapmayacak."
            exit 0
          fi

          if [ "${now}" -ge 0942 ] && [ "${now}" -le 1004 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "commands=teorik" >> "$GITHUB_OUTPUT"
            echo "dedupe=4" >> "$GITHUB_OUTPUT"
            echo "mode=preopen" >> "$GITHUB_OUTPUT"
          elif [ "${now}" -ge 1010 ] && [ "${now}" -le 1825 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "commands=akd,derinlik,kurum" >> "$GITHUB_OUTPUT"
            echo "dedupe=12" >> "$GITHUB_OUTPUT"
            echo "mode=intraday" >> "$GITHUB_OUTPUT"
          elif [ "${now}" -ge 1935 ] && [ "${now}" -le 1945 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "commands=takas" >> "$GITHUB_OUTPUT"
            echo "dedupe=15" >> "$GITHUB_OUTPUT"
            echo "mode=eod" >> "$GITHUB_OUTPUT"
          else
            echo "Bu saat watchdog penceresinde değil: ${now}"
          fi

      - uses: actions/checkout@v4
        if: steps.decide.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.decide.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: "pip"

      - if: steps.decide.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Recover missing ASELS command
        if: steps.decide.outputs.run == 'true'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: "@aselsanhissee"
          SYMBOL: "ASELS"
          COMMANDS: ${{ steps.decide.outputs.commands }}
          COMMAND_DELAY_SECONDS: "10"
          DEDUPE_WINDOW_MINUTES: ${{ steps.decide.outputs.dedupe }}
        run: |
          echo "ASELS watchdog mode: ${{ steps.decide.outputs.mode }}"
          python -m src.main
