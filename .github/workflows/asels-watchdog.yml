name: ASELS Watchdog

on:
  schedule:
    # Açılış öncesi teorik komutlar için yedek kontroller (UTC)
    - cron: "43,48,53,57 6 * * 1-5"
    - cron: "2 7 * * 1-5"
    # Türkiye saati 10:00-18:55 arasında her 5 dakikada bir watchdog heartbeat
    - cron: "*/5 7-15 * * 1-5"
    # 19:30 takas için 19:35 yedek kontrolü
    - cron: "35 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-target-asels-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide watchdog action
        id: decide
        shell: bash
        run: |
          now="$(TZ=Europe/Istanbul date +%H%M)"
          hour="$(TZ=Europe/Istanbul date +%H)"
          minute="$(TZ=Europe/Istanbul date +%M)"
          dow="$(TZ=Europe/Istanbul date +%u)"

          echo "run=false" >> "$GITHUB_OUTPUT"

          if [ "${dow}" -gt 5 ]; then
            echo "Hafta sonu: watchdog işlem yapmayacak."
            exit 0
          fi

          # Pre-open backups: 09:43, 09:48, 09:53, 09:57, 10:02 civarı.
          if [ "${now}" -ge 0942 ] && [ "${now}" -le 1004 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "commands=teorik" >> "$GITHUB_OUTPUT"
            echo "dedupe=4" >> "$GITHUB_OUTPUT"
            echo "mode=preopen" >> "$GITHUB_OUTPUT"

          # Intraday backups: ana 10:05/20/35/50 turlarının 5 dk sonrası 10/25/40/55.
          elif [ "${hour}" -ge 10 ] && [ "${hour}" -le 17 ] && [[ "${minute}" =~ ^(10|25|40|55)$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "commands=akd,derinlik,kurum" >> "$GITHUB_OUTPUT"
            echo "dedupe=10" >> "$GITHUB_OUTPUT"
            echo "mode=intraday" >> "$GITHUB_OUTPUT"

          # 18:05 ve 18:15 ana turları için 18:10 ve 18:20 yedekleri.
          elif [ "${hour}" = "18" ] && [[ "${minute}" =~ ^(10|20)$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "commands=akd,derinlik,kurum" >> "$GITHUB_OUTPUT"
            echo "dedupe=10" >> "$GITHUB_OUTPUT"
            echo "mode=intraday" >> "$GITHUB_OUTPUT"

          # 19:30 takas için 19:35 yedeği.
          elif [ "${hour}" = "19" ] && [ "${minute}" = "35" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "commands=takas" >> "$GITHUB_OUTPUT"
            echo "dedupe=10" >> "$GITHUB_OUTPUT"
            echo "mode=eod" >> "$GITHUB_OUTPUT"
          else
            echo "Watchdog heartbeat; gönderim gerekmiyor: ${now}"
          fi

      - uses: actions/checkout@v4
        if: steps.decide.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.decide.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: "pip"

      - if: steps.decide.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Recover missing ASELS command
        if: steps.decide.outputs.run == 'true'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: "@aselsanhissee"
          SYMBOL: "ASELS"
          COMMANDS: ${{ steps.decide.outputs.commands }}
          COMMAND_DELAY_SECONDS: "10"
          DEDUPE_WINDOW_MINUTES: ${{ steps.decide.outputs.dedupe }}
        run: |
          echo "ASELS watchdog mode: ${{ steps.decide.outputs.mode }}"
          python -m src.main
