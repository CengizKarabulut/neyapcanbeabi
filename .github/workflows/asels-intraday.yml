name: ASELS Intraday Commands

on:
  schedule:
    # Pazartesi-Cuma, Türkiye saati: 10:05-17:50 arası 15 dakikada bir
    - cron: "5,20,35,50 10-17 * * 1-5"
      timezone: "Europe/Istanbul"
    # 18:05 ve 18:15
    - cron: "5,15 18 * * 1-5"
      timezone: "Europe/Istanbul"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asels-intraday-commands
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Send ASELS intraday commands
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: "@aselsanhissee"
          SYMBOL: "ASELS"
          COMMANDS: "akd,derinlik,kurum"
          COMMAND_DELAY_SECONDS: "10"
        run: python -m src.main
