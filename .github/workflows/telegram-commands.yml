name: Telegram ZGYO Commands

on:
  schedule:
    - cron: "5,20,35,50 10-17 * * 1-5"
      timezone: "Europe/Istanbul"
    - cron: "5,15 18 * * 1-5"
      timezone: "Europe/Istanbul"
  workflow_dispatch:
    inputs:
      symbol:
        description: "Hisse kodu (manuel çalıştırma)"
        required: true
        default: "ZGYO"
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-zgyo-commands
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Send Telegram commands
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOL: ${{ github.event_name == 'workflow_dispatch' && inputs.symbol || 'ZGYO' }}
          COMMANDS: "akd,derinlik"
          COMMAND_DELAY_SECONDS: "10"
        run: python -m src.main
