name: Telegram ZGYO Commands

on:
  schedule:
    # Hafta ici 10:05'te baslar ve 14:04:59'a kadar her dakika gonderir.
    - cron: "5 10 * * 1-5"
      timezone: "Europe/Istanbul"
    # Ikinci blok 14:05'te baslar ve 18:15:59'a kadar her dakika gonderir.
    - cron: "5 14 * * 1-5"
      timezone: "Europe/Istanbul"
  workflow_dispatch:
    inputs:
      symbol:
        description: "Hisse kodu (manuel çalıştırma)"
        required: true
        default: "ZGYO"
        type: string
      max_cycles:
        description: "Manuel testte kaç dakikalık tur çalışsın?"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-target-zgyo
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Send ZGYO commands every minute
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOL: ${{ github.event_name == 'workflow_dispatch' && inputs.symbol || 'ZGYO' }}
          COMMANDS: "akd,derinlik"
          COMMAND_DELAY_SECONDS: "10"
          DEDUPE_SECONDS: "45"
          WINDOW_END: ${{ github.event_name == 'schedule' && github.event.schedule == '5 10 * * 1-5' && '14:04:59' || github.event_name == 'schedule' && '18:15:59' || '' }}
          MAX_CYCLES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_cycles || '0' }}
        run: python scripts/minute_commands.py
