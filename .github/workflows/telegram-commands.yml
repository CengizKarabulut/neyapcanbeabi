name: Telegram ZGYO Commands

on:
  schedule:
    # Hafta ici 10:05-10:55 arasi 5 dakikada bir.
    - cron: "5,10,15,20,25,30,35,40,45,50,55 10 * * 1-5"
      timezone: "Europe/Istanbul"
    # 11:00-17:55 arasi 5 dakikada bir.
    - cron: "*/5 11-17 * * 1-5"
      timezone: "Europe/Istanbul"
    # 18:00, 18:05, 18:10 ve 18:15.
    - cron: "0,5,10,15 18 * * 1-5"
      timezone: "Europe/Istanbul"
  push:
    paths:
      - ".github/workflows/telegram-commands.yml"
      - ".github/zgyo-bootstrap"
  workflow_dispatch:
    inputs:
      symbol:
        description: "Hisse kodu (manuel çalıştırma)"
        required: true
        default: "ZGYO"
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-target-zgyo
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Send ZGYO commands every five minutes
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOL: ${{ github.event_name == 'workflow_dispatch' && inputs.symbol || 'ZGYO' }}
          COMMANDS: "akd,derinlik"
          COMMAND_DELAY_SECONDS: "10"
          DEDUPE_WINDOW_MINUTES: ${{ github.event_name == 'schedule' && '4' || '0' }}
        run: python -m src.main
