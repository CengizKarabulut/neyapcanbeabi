name: Telegram Emergency Freeze

on:
  push:
    paths:
      - ".github/heartbeat-v2-bootstrap"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: telegram-emergency-freeze
  cancel-in-progress: true

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel all other active Telegram repository runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select((.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested") and (.id | tostring) != env.CURRENT_RUN_ID) | .id' \
            | while read -r run_id; do
                [ -z "${run_id}" ] && continue
                echo "Cancelling run ${run_id}"
                gh api -X POST "repos/${REPOSITORY}/actions/runs/${run_id}/cancel" || true
              done
