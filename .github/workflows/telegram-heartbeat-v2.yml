name: Telegram Recovery Heartbeat v2

on:
  schedule:
    # Hafta ici 10:00-23:59 TRT. Cron gecikse bile sadece ana loop'u kontrol eder;
    # tek tek Telegram komutlarini dogrudan gondermez.
    - cron: "*/5 7-20 * * 1-5"
  push:
    paths:
      - ".github/heartbeat-v2-bootstrap"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: telegram-recovery-v2
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover live Telegram market loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          dow="$(TZ=Europe/Istanbul date +%u)"
          tr_now="$(TZ=Europe/Istanbul date '+%F %T %Z')"
          echo "TR saati: ${tr_now}"

          if [ "${dow}" -gt 5 ]; then
            echo "Hafta sonu; işlem yok."
            exit 0
          fi

          active_count="$(
            gh api "repos/${REPOSITORY}/actions/workflows/telegram-market-loop.yml/runs?per_page=20" |
              jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length'
          )"

          if [ "${active_count}" -gt 0 ]; then
            echo "Telegram Market Loop zaten aktif; ek komut workflow'u baslatilmiyor."
            exit 0
          fi

          echo "Telegram Market Loop aktif degil; yalniz ana loop kurtarma icin baslatiliyor."
          gh workflow run telegram-market-loop.yml --repo "${REPOSITORY}" --ref main
