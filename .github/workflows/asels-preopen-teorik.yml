name: ASELS Pre-Open Teorik

on:
  schedule:
    # Pazartesi-Cuma, Türkiye saati 09:40, 09:45, 09:50, 09:55 ve 09:58
    - cron: "40,45,50,55,58 9 * * 1-5"
      timezone: "Europe/Istanbul"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-target-asels-teorik
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Send ASELS theoretical command
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: "@aselsanhissee"
          SYMBOL: "ASELS"
          COMMANDS: "teorik"
          COMMAND_DELAY_SECONDS: "10"
          DEDUPE_WINDOW_MINUTES: "2"
        run: python -m src.main
