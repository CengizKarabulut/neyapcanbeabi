name: Telegram Watchdog

on:
  schedule:
    # Ana 15 dakikalık turlardan 7 dakika sonra kontrol:
    # 10:12, 10:27, 10:42, 10:57 ... 17:57
    - cron: "12,27,42,57 10-17 * * 1-5"
      timezone: "Europe/Istanbul"
    # 18:05 turunu 18:12'de, 18:15 turunu 18:22'de kontrol et
    - cron: "12,22 18 * * 1-5"
      timezone: "Europe/Istanbul"
    # 18:30 ASELS takas turunu 18:37'de kontrol et
    - cron: "37 18 * * 1-5"
      timezone: "Europe/Istanbul"
  workflow_dispatch:
    inputs:
      mode:
        description: "Manuel watchdog testi"
        required: true
        default: "intraday"
        type: choice
        options:
          - intraday
          - takas

permissions:
  contents: read

jobs:
  zgyo-watchdog:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'intraday' || github.event_name == 'schedule' && github.event.schedule != '37 18 * * 1-5' }}
    concurrency:
      group: telegram-target-zgyo
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Check and repair ZGYO commands
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOL: "ZGYO"
          COMMANDS: "akd,derinlik"
          COMMAND_DELAY_SECONDS: "10"
          DEDUPE_WINDOW_MINUTES: "12"
        run: python -m src.main

  asels-watchdog:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'intraday' || github.event_name == 'schedule' && github.event.schedule != '37 18 * * 1-5' }}
    concurrency:
      group: telegram-target-asels
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Check and repair ASELS intraday commands
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: "@aselsanhissee"
          SYMBOL: "ASELS"
          COMMANDS: "akd,derinlik,kurum"
          COMMAND_DELAY_SECONDS: "10"
          DEDUPE_WINDOW_MINUTES: "12"
        run: python -m src.main

  asels-takas-watchdog:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'takas' || github.event_name == 'schedule' && github.event.schedule == '37 18 * * 1-5' }}
    concurrency:
      group: telegram-target-asels
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Check and repair ASELS takas command
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: "@aselsanhissee"
          SYMBOL: "ASELS"
          COMMANDS: "takas"
          COMMAND_DELAY_SECONDS: "10"
          DEDUPE_WINDOW_MINUTES: "12"
        run: python -m src.main
