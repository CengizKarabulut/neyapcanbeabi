name: Telegram Scheduler Heartbeat
run-name: "Heartbeat · ${{ github.event.schedule || github.event_name }}"

on:
  schedule:
    - cron: "*/5 10-23 * * 1-5"
      timezone: "Europe/Istanbul"
  push:
    paths:
      - ".github/heartbeat-bootstrap"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: telegram-scheduler-heartbeat
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover missing Telegram schedules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          dow="$(TZ=Europe/Istanbul date +%u)"
          hour="$(TZ=Europe/Istanbul date +%H)"
          minute="$(TZ=Europe/Istanbul date +%M)"
          now_min=$((10#${hour} * 60 + 10#${minute}))

          if [ "${dow}" -gt 5 ]; then
            echo "Hafta sonu; işlem yok."
            exit 0
          fi

          recent_count() {
            local workflow="$1"
            local minutes="$2"
            local cutoff
            cutoff="$(date -u -d "${minutes} minutes ago" +%Y-%m-%dT%H:%M:%SZ)"
            gh api "repos/${REPOSITORY}/actions/workflows/${workflow}/runs?per_page=30" |
              jq --arg cutoff "${cutoff}" '[.workflow_runs[] | select(.created_at >= $cutoff) | select(.status == "queued" or .status == "in_progress" or .conclusion == "success")] | length'
          }

          # ZGYO: 10:05-18:15 arası 5 dakikalık ritim. Son 8 dakikada koşu yoksa kurtar.
          if (( now_min >= 605 && now_min <= 1095 )); then
            zgyo_recent="$(recent_count telegram-commands.yml 8)"
            if [ "${zgyo_recent}" -eq 0 ]; then
              echo "Son 8 dakikada ZGYO turu yok; kurtarma turu başlatılıyor."
              gh workflow run telegram-commands.yml --repo "${REPOSITORY}" --ref main -f symbol=ZGYO
            else
              echo "ZGYO 5 dakikalık akışı yakın zamanda çalışmış."
            fi
          fi

          # ASELS: 10:05-18:05 arası 30 dakikalık ritim. Son 34 dakikada koşu yoksa kurtar.
          if (( now_min >= 605 && now_min <= 1085 )); then
            asels_recent="$(recent_count asels-intraday.yml 34)"
            if [ "${asels_recent}" -eq 0 ]; then
              echo "Son 34 dakikada ASELS turu yok; kurtarma turu başlatılıyor."
              gh workflow run asels-intraday.yml --repo "${REPOSITORY}" --ref main
            else
              echo "ASELS 30 dakikalık akışı yakın zamanda çalışmış."
            fi
          fi

          if (( now_min >= 1115 && now_min <= 1130 )); then
            asels_takas_recent="$(recent_count asels-eod-takas.yml 25)"
            if [ "${asels_takas_recent}" -eq 0 ]; then
              echo "ASELS takas bulunamadı; kurtarma çalıştırılıyor."
              gh workflow run asels-eod-takas.yml --repo "${REPOSITORY}" --ref main
            fi
          fi

          if (( now_min >= 1095 && now_min <= 1395 )); then
            zgyo_takas_recent="$(recent_count zgyo-evening-takas.yml 34)"
            if [ "${zgyo_takas_recent}" -eq 0 ]; then
              echo "ZGYO akşam takas yakın zamanda yok; kurtarma çalıştırılıyor."
              gh workflow run zgyo-evening-takas.yml --repo "${REPOSITORY}" --ref main
            else
              echo "ZGYO akşam takas yakın zamanda çalışmış."
            fi
          fi
