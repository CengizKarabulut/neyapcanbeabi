name: ZGYO 5 Minute Commands

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-target-zgyo
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard Turkish market hours
        id: guard
        shell: bash
        run: |
          now="$(TZ=Europe/Istanbul date +%H%M)"
          dow="$(TZ=Europe/Istanbul date +%u)"
          if [ "${dow}" -le 5 ] && [ "${now}" -ge 1005 ] && [ "${now}" -le 1815 ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "ZGYO AKD/derinlik piyasa saati disinda engellendi: $(TZ=Europe/Istanbul date '+%F %T')"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.allowed == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.allowed == 'true'
        with:
          python-version: "3.12"
          cache: "pip"
      - if: steps.guard.outputs.allowed == 'true'
        run: python -m pip install -r requirements.txt
      - name: Send ZGYO 5-minute commands
        if: steps.guard.outputs.allowed == 'true'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOL: "ZGYO"
          COMMANDS: "akd,derinlik"
          COMMAND_DELAY_SECONDS: "10"
          DEDUPE_WINDOW_MINUTES: "4"
        run: python -m src.main
