name: ASELS End of Day Takas

on:
  schedule:
    # Pazartesi-Cuma, Türkiye saati 18:30
    - cron: "30 18 * * 1-5"
      timezone: "Europe/Istanbul"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-target-asels
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Send ASELS takas command
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: "@aselsanhissee"
          SYMBOL: "ASELS"
          COMMANDS: "takas"
          COMMAND_DELAY_SECONDS: "10"
          DEDUPE_WINDOW_MINUTES: ${{ github.event_name == 'schedule' && '12' || '0' }}
        run: python -m src.main
