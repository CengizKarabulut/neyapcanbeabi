name: Cancel Stale Telegram Loop

on:
  push:
    paths:
      - ".github/workflows/cancel-stale-loop.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Telegram Market Loop run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/runs/34862000471/cancel" || true
