name: ASELS 30 Minute Commands

on:
  schedule:
    # UTC cron; Turkiye UTC+3. 10:05-17:35 TRT her 30 dakikada bir.
    - cron: "5,35 7-14 * * 1-5"
    # 18:05 TRT son intraday turu.
    - cron: "5 15 * * 1-5"
  push:
    paths:
      - ".github/asels-v2-bootstrap"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-target-asels
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Send ASELS 30-minute commands
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: "@aselsanhissee"
          SYMBOL: "ASELS"
          COMMANDS: "akd,derinlik,kurum"
          COMMAND_DELAY_SECONDS: "10"
          DEDUPE_WINDOW_MINUTES: "28"
        run: python -m src.main
