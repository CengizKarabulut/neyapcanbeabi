name: ASELS Session Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/asels-session-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Send one ASELS command with user session
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: "@aselsanhissee"
          SYMBOL: "ASELS"
          COMMANDS: "akd"
          COMMAND_DELAY_SECONDS: "0"
          DEDUPE_WINDOW_MINUTES: "0"
          TELEGRAM_CONNECT_TIMEOUT_SECONDS: "20"
          TELEGRAM_REQUEST_TIMEOUT_SECONDS: "20"
          TELEGRAM_DEDUP_TIMEOUT_SECONDS: "20"
        run: python -m src.main
