name: ZGYO Research Report Telegram

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/zgyo-research-report-bootstrap'

permissions:
  contents: read

concurrency:
  group: zgyo-research-report-telegram
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install report dependencies
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 https://github.com/CengizKarabulut/taramabot.git /tmp/taramabot
          pip install -r /tmp/taramabot/requirements-cached-scan.txt
          pip install Telethon==1.43.0 pytest
      - name: Build live ZGYO multi-timeframe database
        env:
          MPLBACKEND: Agg
        run: |
          cd /tmp/taramabot
          python - <<'PY'
          import borsapy as bp
          from market_data_store import MarketDataStore, resample_bist_intraday, resample_calendar

          symbol = 'ZGYO'
          t = bp.Ticker(symbol)
          intraday = t.history(period='6mo', interval='15m')
          daily = t.history(period='2y', interval='1d')
          if intraday is None or intraday.empty:
              raise SystemExit('ZGYO 15m history is empty')
          if daily is None or daily.empty:
              raise SystemExit('ZGYO daily history is empty')

          with MarketDataStore('data/zgyo_report.sqlite') as store:
              store.upsert_dataframe(symbol, 'BIST', '15m', intraday)
              for p in ('45m','2H','4H'):
                  store.upsert_dataframe(symbol, 'BIST', p, resample_bist_intraday(intraday, p))
              store.upsert_dataframe(symbol, 'BIST', '1D', daily)
              store.upsert_dataframe(symbol, 'BIST', '1W', resample_calendar(daily, '1W'))
          print('ZGYO bars:', len(intraday), len(daily))
          PY
          python multi_timeframe_context.py --db data/zgyo_report.sqlite --symbols ZGYO --output-dir data/zgyo-report/mtf
      - name: Build fundamental and 8-quarter report
        env:
          MPLBACKEND: Agg
        run: |
          cd /tmp/taramabot
          python fundamental_peer_refresh.py --output-dir data/fundamentals
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('data/zgyo-report/mtf/ZGYO/mtf_context.json').read_text(encoding='utf-8'))
          h4 = r['timeframes'].get('4H', {})
          candidate = {
              'symbol':'ZGYO', 'price':r.get('price'), 'tier':'ANALIZ', 'priority':'MANUEL RAPOR',
              'reason':f"Çoklu zaman dilimi uyumu: {r['alignment']['label']} ({r['alignment']['score']}). Bu kayıt production sinyali değil, talep üzerine analizdir.",
              'models':{}, 'system_j':{}, 'smi_macd':{},
              'structure':{
                  'trend':h4.get('trend'), 'bos':h4.get('bos'),
                  'last_swing_high':h4.get('last_swing_high'), 'last_swing_low':h4.get('last_swing_low'),
                  'pivots':h4.get('pivots', [])
              },
              'elliott':h4.get('elliott', {}), 'chart':'mtf/ZGYO/mtf_structure.png'
          }
          out = Path('data/zgyo-report/manual_visual.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({'candidates':[candidate]}, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          python fundamental_data_pipeline.py candidates --visual-json data/zgyo-report/manual_visual.json --peer-csv data/fundamentals/latest.csv --output-dir data/zgyo-report/quarterly
          python institutional_stock_report.py --visual-json data/zgyo-report/manual_visual.json --fundamentals-csv data/fundamentals/latest.csv --fundamental-trends-dir data/zgyo-report/quarterly --output-dir data/zgyo-report/reports
      - name: Send report to Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd /tmp/taramabot
          PYTHONPATH="$GITHUB_WORKSPACE:$PYTHONPATH" python - <<'PY'
          import asyncio, os
          from pathlib import Path
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from src.main import resolve_target

          api_id = int(os.environ['TELEGRAM_API_ID'])
          api_hash = os.environ['TELEGRAM_API_HASH']
          session = os.environ['TELEGRAM_SESSION']
          target_raw = os.environ['TELEGRAM_CHAT_ID'].strip()
          try:
              chat_target = int(target_raw)
          except ValueError:
              chat_target = target_raw

          md = Path('data/zgyo-report/reports/ZGYO/report.md').read_text(encoding='utf-8')
          text = '📊 ZGYO · Araştırma Raporu\n\n' + md
          if len(text) > 3900:
              text = text[:3850] + '\n\n…rapor kısaltıldı; görseller aşağıda.'

          files = [
              'data/zgyo-report/mtf/ZGYO/mtf_structure.png',
              'data/zgyo-report/reports/ZGYO/fundamental_scorecard.png',
              'data/zgyo-report/reports/ZGYO/fundamental_trend.png',
          ]
          files = [f for f in files if Path(f).exists()]

          async def main():
              client = TelegramClient(StringSession(session), api_id, api_hash)
              try:
                  await client.connect()
                  if not await client.is_user_authorized():
                      raise RuntimeError('Telegram session is not authorized')
                  target = await resolve_target(client, chat_target)
                  print('Resolved Telegram target:', getattr(target, 'title', '?'), getattr(target, 'id', '?'))
                  await client.send_message(target, text)
                  if files:
                      await client.send_file(target, files, caption='ZGYO · Çoklu zaman dilimi + temel/bilanço görselleri')
              finally:
                  await client.disconnect()

          asyncio.run(main())
          print('Telegram report sent:', len(files), 'image(s)')
          PY
      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zgyo-research-report
          path: /tmp/taramabot/data/zgyo-report
          if-no-files-found: warn
          retention-days: 7
