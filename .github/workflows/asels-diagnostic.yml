name: ASELS Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/asels-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test one ASELS command with Bot API
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@aselsanhissee"
          SYMBOL: "ASELS"
          COMMANDS: "akd"
          COMMAND_DELAY_SECONDS: "0"
          TELEGRAM_REQUEST_TIMEOUT_SECONDS: "20"
        run: python -m src.main
